<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=Space+Grotesk:wght@400;500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Space Grotesk', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #FF5B39; } a:hover { color: #e0472a; }
    input.todo-in { font-family: 'Space Grotesk', system-ui, sans-serif; }
    input.todo-in::placeholder { color: #a89b8a; font-weight: 500; }
    .lst { scrollbar-width: none; }
    .lst::-webkit-scrollbar { width: 0; height: 0; }
    .row { transition: transform .12s ease; }
    .row:active { transform: translate(2px, 2px); }
    .addbtn:active, .seg:active, .tab:active { transform: translate(1px, 1px); }
    .bar { transition: height .35s cubic-bezier(.3,1.3,.5,1); }
    @keyframes pop { 0% { transform: scale(.6); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    .pop { animation: pop .18s cubic-bezier(.3,1.4,.5,1) both; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #FDF3E7; display: flex; flex-direction: column; color: #17130F; overflow: hidden;">

  <!-- ===== View host ===== -->
  <div style="flex: 1; min-height: 0; position: relative;">

    <!-- ---------- TASKS VIEW ---------- -->
    <sc-if value="{{showTasks}}" hint-placeholder-val="{{true}}">
      <div style="height: 100%; display: flex; flex-direction: column;">
        <div style="padding: 52px 24px 18px; flex-shrink: 0;">
          
          <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 16px;">
            <div>
              <div style="font-family: 'Bricolage Grotesque', 'Trebuchet MS', sans-serif; font-weight: 800; font-size: 40px; line-height: 0.95; letter-spacing: -0.02em;">My Day</div>
              <div style="margin-top: 8px; font-size: 14px; font-weight: 500; color: #7a6f60;">{{today}}</div>
            </div>
            <div style="background: #17130F; color: #FDF3E7; border-radius: 16px; padding: 10px 14px; text-align: center; min-width: 62px;">
              <div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 24px; line-height: 1;">{{remaining}}</div>
              <div style="font-size: 10px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; opacity: 0.7; margin-top: 2px;">left</div>
            </div>
          </div><div style="margin-top: 18px; height: 12px; background: #F0E2CE; border: 2px solid #17130F; border-radius: 20px; overflow: hidden;">
            <div style="height: 100%; width: {{progressWidth}}; background: {{accent}}; border-radius: 20px; transition: width .3s cubic-bezier(.3,1.2,.5,1);"></div>
          </div>
        </div>

        <div style="padding: 0 24px 16px; flex-shrink: 0;">
          <form onSubmit="{{addTodo}}" style="display: flex; gap: 10px; background: #FFFFFF; border: 2.5px solid #17130F; border-radius: 20px; padding: 8px 8px 8px 18px; box-shadow: 5px 5px 0 #17130F; align-items: center;">
            <input class="todo-in" value="{{draft}}" onInput="{{onDraft}}" placeholder="Add a task…" style="flex: 1; border: none; outline: none; background: transparent; font-size: 16px; font-weight: 600; color: #17130F; min-width: 0;">
            <button type="submit" class="addbtn" style="flex-shrink: 0; width: 46px; height: 46px; border: 2.5px solid #17130F; border-radius: 14px; background: {{accent}}; display: flex; align-items: center; justify-content: center; cursor: pointer;">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#17130F" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
            </button>
          </form>
        </div>

        <div style="padding: 0 24px 14px; flex-shrink: 0; display: flex; gap: 10px;">
          <sc-for list="{{filters}}" as="chip" hint-placeholder-count="3">
            <button class="seg" onClick="{{chip.select}}" style="{{chip.style}}">{{chip.label}}</button>
          </sc-for>
        </div>

        <div class="lst" style="flex: 1; min-height: 0; overflow-y: auto; padding: 4px 24px 20px;">
          <sc-if value="{{isEmpty}}" hint-placeholder-val="{{true}}">
            <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 48px 20px; text-align: center;">
              <div style="width: 96px; height: 96px; border: 2.5px solid #17130F; border-radius: 28px; background: #FFE9A8; display: flex; align-items: center; justify-content: center; box-shadow: 5px 5px 0 #17130F; transform: rotate(-4deg);">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#17130F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"></path><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
              </div>
              <div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 22px; margin-top: 22px;">{{emptyTitle}}</div>
              <div style="font-size: 14px; font-weight: 500; color: #7a6f60; margin-top: 6px; max-width: 220px; text-wrap: pretty;">{{emptyBody}}</div>
            </div>
          </sc-if>
          <sc-for list="{{visible}}" as="item" hint-placeholder-count="4">
            <div class="row pop" style="{{item.rowStyle}}">
              <button onClick="{{item.toggle}}" style="{{item.boxStyle}}">
                <sc-if value="{{item.done}}" hint-placeholder-val="{{true}}">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg>
                </sc-if>
              </button>
              <span style="{{item.textStyle}}">{{item.text}}</span>
              <button onClick="{{item.remove}}" style="flex-shrink: 0; width: 30px; height: 30px; border: none; background: transparent; border-radius: 9px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #b7ab99;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"></path></svg>
              </button>
            </div>
          </sc-for>
        </div>
      </div>
    </sc-if>

    <!-- ---------- PROGRESS VIEW ---------- -->
    <sc-if value="{{showDash}}" hint-placeholder-val="{{true}}">
      <div style="height: 100%; display: flex; flex-direction: column;">
        <div style="padding: 52px 24px 16px; flex-shrink: 0;">
          <div style="font-size: 14px; font-weight: 600; color: #7a6f60;">Your progress</div>
          <div style="font-family: 'Bricolage Grotesque', 'Trebuchet MS', sans-serif; font-weight: 800; font-size: 40px; line-height: 0.95; letter-spacing: -0.02em; margin-top: 4px;">Dashboard</div>
          <div style="margin-top: 18px; display: inline-flex; gap: 4px; background: #F0E2CE; border: 2.5px solid #17130F; border-radius: 30px; padding: 4px;">
            <sc-for list="{{periods}}" as="p" hint-placeholder-count="2">
              <button class="seg" onClick="{{p.select}}" style="{{p.style}}">{{p.label}}</button>
            </sc-for>
          </div>
        </div>

        <div class="lst" style="flex: 1; min-height: 0; overflow-y: auto; padding: 4px 24px 20px;">
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-bottom: 12px;">
            <div style="background: #FFE9A8; border: 2.5px solid #17130F; border-radius: 20px; padding: 16px; box-shadow: 4px 4px 0 #17130F;">
              <div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 40px; line-height: 1;">{{doneTotal}}</div>
              <div style="font-size: 13px; font-weight: 600; color: #6b5f2f; margin-top: 4px;">tasks completed</div>
            </div>
            <div style="background: #FFFFFF; border: 2.5px solid #17130F; border-radius: 20px; padding: 16px; box-shadow: 4px 4px 0 #17130F;">
              <div style="display: flex; align-items: center; gap: 6px;">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="{{accent}}" stroke="#17130F" stroke-width="1.6" stroke-linejoin="round"><path d="M12 2c1 4-2 5-2 8a4 4 0 0 0 8 0c0-2-1-3-1-3 2 1 3 4 3 6a8 8 0 0 1-16 0c0-5 5-7 6-11z"></path></svg>
                <div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 40px; line-height: 1;">{{streak}}</div>
              </div>
              <div style="font-size: 13px; font-weight: 600; color: #7a6f60; margin-top: 4px;">day streak</div>
            </div>
          </div>

          <div style="background: #FFFFFF; border: 2.5px solid #17130F; border-radius: 22px; padding: 18px 16px 14px; box-shadow: 5px 5px 0 #17130F; margin-bottom: 12px;">
            <div style="display: flex; justify-content: space-between; align-items: baseline;">
              <div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 17px;">Tasks per day</div>
              <div style="font-size: 12px; font-weight: 600; color: #7a6f60;">best: {{bestDay}}</div>
            </div>
            <div style="display: flex; align-items: flex-end; gap: 8px; height: 150px; margin-top: 16px;">
              <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
                <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px;">
                  <div style="font-size: 11px; font-weight: 700; color: #17130F;">{{d.value}}</div>
                  <div class="bar" style="{{d.barStyle}}"></div>
                  <div style="font-size: 11px; font-weight: 600; color: #a89b8a;">{{d.label}}</div>
                </div>
              </sc-for>
            </div>
          </div>

          <div style="background: #17130F; color: #FDF3E7; border: 2.5px solid #17130F; border-radius: 20px; padding: 16px 18px; box-shadow: 4px 4px 0 {{accent}}; margin-bottom: 12px;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <div style="font-size: 14px; font-weight: 600;">Completion rate</div>
              <div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 22px;">{{rate}}%</div>
            </div>
            <div style="margin-top: 12px; height: 12px; background: rgba(253,243,231,0.18); border-radius: 20px; overflow: hidden;">
              <div style="height: 100%; width: {{rateWidth}}; background: {{accent}}; border-radius: 20px; transition: width .4s cubic-bezier(.3,1.2,.5,1);"></div>
            </div>
          </div>

          <div style="background: #FFFFFF; border: 2.5px solid #17130F; border-radius: 22px; padding: 18px 16px; box-shadow: 5px 5px 0 #17130F;">
            <div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 17px; margin-bottom: 14px;">By category</div>
            <sc-for list="{{categories}}" as="c" hint-placeholder-count="3">
              <div style="margin-bottom: 14px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                  <div style="display: flex; align-items: center; gap: 8px;">
                    <div style="{{c.dotStyle}}"></div>
                    <span style="font-size: 14px; font-weight: 600;">{{c.name}}</span>
                  </div>
                  <span style="font-size: 13px; font-weight: 700; color: #7a6f60;">{{c.count}}</span>
                </div>
                <div style="height: 10px; background: #F0E2CE; border: 2px solid #17130F; border-radius: 20px; overflow: hidden;">
                  <div style="{{c.barStyle}}"></div>
                </div>
              </div>
            </sc-for>
          </div>
        </div>
      </div>
    </sc-if>

  </div>

  <!-- ===== Bottom nav ===== -->
  <div style="flex-shrink: 0; height: 78px; background: #FFFFFF; border-top: 2.5px solid #17130F; display: flex; padding: 8px 24px 0;">
    <button class="tab" onClick="{{goTasks}}" style="flex: 1; border: none; background: transparent; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; padding-top: 4px;">
      <div style="{{tasksChip}}">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{tasksIcon}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"></path><path d="M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"></path></svg>
      </div>
      <span style="{{tasksLabel}}">Tasks</span>
    </button>
    <button class="tab" onClick="{{goDash}}" style="flex: 1; border: none; background: transparent; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; padding-top: 4px;">
      <div style="{{dashChip}}">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{dashIcon}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"></path></svg>
      </div>
      <span style="{{dashLabel}}">Progress</span>
    </button>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"accent":{"editor":"color","default":"#FF5B39","options":["#FF5B39","#7C5CFC","#1FB574","#F5A623"],"section":"Theme"}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.nextId = 6;
    this.state = {
      view: 'tasks',
      draft: '',
      filter: 'all',
      period: 'this',
      items: [
        { id: 1, text: 'Sketch the bold playful direction', done: true },
        { id: 2, text: 'Buy oat milk & good coffee', done: false },
        { id: 3, text: 'Reply to Priya about the launch', done: false },
        { id: 4, text: 'Walk 30 min after lunch', done: false },
        { id: 5, text: 'Book dentist appointment', done: true }
      ]
    };
  }

  renderVals() {
    const accent = this.props.accent ?? '#FF5B39';
    const view = this.state.view;

    // ---- Bottom nav ----
    const chip = (on) => 'width: 46px; height: 34px; border-radius: 12px; display: flex; align-items: center; justify-content: center; '
      + (on ? 'background: ' + accent + '; border: 2.5px solid #17130F;' : 'background: transparent;');
    const label = (on) => 'font-size: 11px; font-weight: ' + (on ? '700' : '600') + '; color: ' + (on ? '#17130F' : '#a89b8a') + ';';
    const tasksOn = view === 'tasks';
    const dashOn = view === 'progress';

    // ---- Tasks data ----
    const items = this.state.items;
    const filter = this.state.filter;
    const onDraft = (e) => this.setState({ draft: e.target.value });
    const addTodo = (e) => {
      if (e && e.preventDefault) e.preventDefault();
      const t = (this.state.draft || '').trim();
      if (!t) return;
      const id = this.nextId++;
      this.setState({ items: [{ id, text: t, done: false }, ...this.state.items], draft: '' });
    };
    const total = items.length;
    const doneCount = items.filter((i) => i.done).length;
    const remaining = total - doneCount;
    const progressWidth = total ? Math.round((doneCount / total) * 100) + '%' : '0%';

    const fdefs = [{ key: 'all', label: 'All' }, { key: 'active', label: 'To do' }, { key: 'done', label: 'Done' }];
    const filters = fdefs.map((d) => {
      const on = filter === d.key;
      const style = 'font-family: Space Grotesk, sans-serif; font-weight: 700; font-size: 14px; padding: 9px 18px; border: 2.5px solid #17130F; border-radius: 30px; cursor: pointer; '
        + (on ? 'background: ' + accent + '; color: #17130F; box-shadow: 3px 3px 0 #17130F;' : 'background: #FFFFFF; color: #17130F;');
      return { key: d.key, label: d.label, style, select: () => this.setState({ filter: d.key }) };
    });

    const shown = items.filter((i) => filter === 'all' ? true : filter === 'active' ? !i.done : i.done);
    const visible = shown.map((it) => {
      const rowStyle = 'display: flex; align-items: center; gap: 14px; background: '
        + (it.done ? '#F5EEDF' : '#FFFFFF')
        + '; border: 2.5px solid #17130F; border-radius: 18px; padding: 14px 12px 14px 14px; margin-bottom: 12px; box-shadow: '
        + (it.done ? '2px 2px 0 #17130F' : '4px 4px 0 #17130F') + ';';
      const boxStyle = 'flex-shrink: 0; width: 28px; height: 28px; border: 2.5px solid #17130F; border-radius: 9px; display: flex; align-items: center; justify-content: center; cursor: pointer; background: '
        + (it.done ? '#1FB574' : '#FFFFFF') + ';';
      const textStyle = 'flex: 1; font-size: 16px; font-weight: 600; line-height: 1.3; word-break: break-word; '
        + (it.done ? 'color: #a89b8a; text-decoration: line-through;' : 'color: #17130F;');
      return {
        ...it, rowStyle, boxStyle, textStyle,
        toggle: () => this.setState({ items: this.state.items.map((x) => x.id === it.id ? { ...x, done: !x.done } : x) }),
        remove: () => this.setState({ items: this.state.items.filter((x) => x.id !== it.id) })
      };
    });

    const emptyMap = {
      all: { t: 'All clear!', b: 'No tasks yet. Add one above and get rolling.' },
      active: { t: 'Nothing to do', b: 'Every task is checked off. Go enjoy your day.' },
      done: { t: 'Nothing done yet', b: 'Finish a task and it will show up here.' }
    };
    const em = emptyMap[filter] || emptyMap.all;
    const today = new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });

    // ---- Dashboard data ----
    const period = this.state.period;
    const data = {
      this: { days: [['M', 3], ['T', 5], ['W', 2], ['T', 6], ['F', 4], ['S', 1], ['S', 2]], streak: 5, rate: 78, best: 'Thu' },
      last: { days: [['M', 2], ['T', 4], ['W', 3], ['T', 3], ['F', 5], ['S', 2], ['S', 4]], streak: 3, rate: 64, best: 'Fri' }
    };
    const cur = data[period];
    const pdefs = [{ key: 'this', label: 'This week' }, { key: 'last', label: 'Last week' }];
    const periods = pdefs.map((d) => {
      const on = period === d.key;
      const style = 'font-family: Space Grotesk, sans-serif; font-weight: 700; font-size: 13px; padding: 8px 16px; border: none; border-radius: 24px; cursor: pointer; '
        + (on ? 'background: #17130F; color: #FDF3E7;' : 'background: transparent; color: #17130F;');
      return { key: d.key, label: d.label, style, select: () => this.setState({ period: d.key }) };
    });
    const vals = cur.days.map((d) => d[1]);
    const max = Math.max(...vals, 1);
    const doneTotal = vals.reduce((a, b) => a + b, 0);
    const days = cur.days.map((d) => {
      const h = Math.round((d[1] / max) * 118) + 6;
      const barStyle = 'width: 100%; height: ' + h + 'px; background: ' + accent + '; border: 2px solid #17130F; border-radius: 8px 8px 3px 3px;';
      return { label: d[0], value: d[1], barStyle };
    });
    const cats = [
      { name: 'Work', count: 12, pct: 80, color: accent },
      { name: 'Personal', count: 7, pct: 55, color: '#7C5CFC' },
      { name: 'Health', count: 4, pct: 35, color: '#1FB574' }
    ];
    const categories = cats.map((c) => ({
      name: c.name, count: c.count,
      dotStyle: 'width: 12px; height: 12px; border-radius: 4px; border: 2px solid #17130F; background: ' + c.color + ';',
      barStyle: 'height: 100%; width: ' + c.pct + '%; background: ' + c.color + '; border-radius: 20px;'
    }));

    return {
      accent,
      showTasks: tasksOn, showDash: dashOn,
      goTasks: () => this.setState({ view: 'tasks' }),
      goDash: () => this.setState({ view: 'progress' }),
      tasksChip: chip(tasksOn), tasksIcon: tasksOn ? '#17130F' : '#a89b8a', tasksLabel: label(tasksOn),
      dashChip: chip(dashOn), dashIcon: dashOn ? '#17130F' : '#a89b8a', dashLabel: label(dashOn),
      // tasks
      today, remaining, progressWidth, draft: this.state.draft, onDraft, addTodo,
      filters, visible, isEmpty: visible.length === 0, emptyTitle: em.t, emptyBody: em.b,
      // dashboard
      periods, days, doneTotal, streak: cur.streak, rate: cur.rate, rateWidth: cur.rate + '%',
      bestDay: cur.best, categories
    };
  }
}
</script>
</body>
</html>
